; PlatformIO - Nodo BOMBA (peristaltica 12 V, encoder magnetico AS5600 + Puente H)
;
; Producción: ESP32-S3 (SuperMini / DevKitC-1, 4MB).
; Soporta:
;   - Control de velocidad en lazo cerrado PI (100 Hz) con encoder AS5600.
;   - Driver Puente H bidireccional (dosificación hacia adelante + retracción anti-goteo suck-back).
;   - Sensor virtual de caudal (mL/min) a partir de velocidad angular.
;   - Consola CLI interactiva (USB CDC) para sintonización en caliente y streaming SysID.
;   - Integración con orquestador AquaStation (MQTT schema v2 + eventos de dosificación).
;
; Comandos habituales:
;   pio run                                    -> Construye entorno de produccion real (esp32-s3)
;   pio run -t upload                          -> Flashea por USB al ESP32-S3
;   pio run -e esp32-s3-bench-sim -t upload    -> Flashea en modo simulacion (para pruebas sin hardware)
;   pio run -e esp32-s3-ota -t upload          -> Flashea via WiFi OTA (pump-doser.local)
;   pio device monitor -b 115200               -> Abre consola CLI interactiva

[platformio]
default_envs = esp32-s3

; ---------------------------------------------------------------
; PRODUCCIÓN REAL: ESP32-S3 (SuperMini / DevKitC-1, 4 MB)
; ---------------------------------------------------------------
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOTA_ENABLED=1
build_src_filter = +<main.cpp> +<aqua_link.cpp> +<pump_bus_real.cpp> +<pump_controller.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = pump-doser.local
upload_flags =
    --port=3232
    --timeout=60

; ---------------------------------------------------------------
; BANCO DE PRUEBAS ESP32-S3
; ---------------------------------------------------------------
; Modo Simulado: Permite probar el lazo PI, comandos CLI y streaming SysID
; en el ESP32-S3 conectado sin requerir la bomba ni el encoder fisicos.
[env:esp32-s3-bench-sim]
extends = env:esp32-s3
build_flags =
    -DPUMP_VIRTUAL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOTA_ENABLED=0
build_src_filter = +<main.cpp> +<aqua_link.cpp> +<pump_bus_virtual.cpp> +<pump_sim.cpp> +<pump_controller.cpp>

; Modo Banco Real: Para banco de pruebas con hardware real y consola USB CDC sin OTA
[env:esp32-s3-bench]
extends = env:esp32-s3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOTA_ENABLED=0
build_src_filter = +<main.cpp> +<aqua_link.cpp> +<pump_bus_real.cpp> +<pump_controller.cpp>

; Alias virtual para orquestacion y pruebas de UI con AquaStation
[env:esp32-s3-virtual]
extends = env:esp32-s3
build_flags =
    -DPUMP_VIRTUAL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOTA_ENABLED=1
build_src_filter = +<main.cpp> +<aqua_link.cpp> +<pump_bus_virtual.cpp> +<pump_sim.cpp> +<pump_controller.cpp>

; ---------------------------------------------------------------
; ENTORNO LEGACY: ESP32 DEV (WROOM-32)
; ---------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp> +<aqua_link.cpp> +<pump_bus_real.cpp> +<pump_controller.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = pump-doser.local
upload_flags =
    --port=3232
    --timeout=60

[env:esp32dev-virtual]
extends = env:esp32dev
build_flags =
    -DPUMP_VIRTUAL=1
build_src_filter = +<main.cpp> +<aqua_link.cpp> +<pump_bus_virtual.cpp> +<pump_sim.cpp> +<pump_controller.cpp>
