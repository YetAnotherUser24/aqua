; PlatformIO - Nodo VIBRACION (MPU6050 + ESP32-C3)
;
; Monitoreo de vibracion estructural y estado mecanico del tanque.
; Protocolo: Schema-v2 sobre MQTT (aqua/tlm/vibration).
;
;   pio run                       -> compila entorno por defecto (esp32-c3)
;   pio run -e esp32-c3-virtual   -> compila entorno virtual (bus simulado)
;   pio run -t upload             -> flashea por USB

[platformio]
default_envs = esp32-c3

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
lib_extra_dirs = lib
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

; ---------------------------------------------------------------
; ENTORNO REAL: ESP32-C3 con sensor fisico MPU6050
; ---------------------------------------------------------------
[env:esp32-c3]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNODE_REAL_HARDWARE=1
build_src_filter =
    +<*>
    -<vibration_bus_virtual.cpp>

; ---------------------------------------------------------------
; ENTORNO VIRTUAL: ESP32-C3 simulando senales de vibracion
; ---------------------------------------------------------------
[env:esp32-c3-virtual]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNODE_VIRTUAL=1
build_src_filter =
    +<*>
    -<vibration_bus_real.cpp>

; ---------------------------------------------------------------
; ENTORNO OTA: Flasheo inalambrico
; ---------------------------------------------------------------
[env:esp32-c3-ota]
extends = env:esp32-c3
upload_protocol = espota
upload_port = vibration-node.local
upload_flags =
    --port=3232
    --timeout=60
