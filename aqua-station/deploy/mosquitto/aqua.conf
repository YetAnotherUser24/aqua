# =============================================================================
# Mosquitto - LAN-only MQTT broker
# =============================================================================
# Install to: /etc/mosquitto/conf.d/aqua.conf
#
# Replaces 1 Hz HTTPS polling. The aerator previously issued ~2,400-3,600
# requests/hour to GET /api/commands/pending, 77% of its traffic, almost all of
# which answered "no command". That is what exhausted Vercel's CPU budget.
#
# Deliberate choice: plain MQTT on the LAN, no TLS. All nodes share one AP with
# this broker, so TLS would cost each ESP32 ~40-60 KB RAM and 1-3 s per handshake
# to protect a link that is already private. Note the previous firmware used
# WiFiClientSecure with setInsecure() - full TLS cost, zero validation. Dropping
# it is strictly an improvement on both axes.
#
# Memory footprint: roughly 10 MB.
# =============================================================================

# -- listeners ---------------------------------------------------------------
# The LAN interface only. Loopback is implicit.
listener 1883 0.0.0.0

# No anonymous access. Each node has its own credentials, so a compromised or
# misflashed node can be revoked without rekeying the fleet.
allow_anonymous false
password_file /etc/mosquitto/passwd

# -- persistence -------------------------------------------------------------
# Persist so that QoS 1 messages and, critically, *subscriptions* survive a broker
# restart. With `clean_session=false`, a command issued while a node deep-sleeps
# must still be delivered when it wakes; without persistence a broker restart
# silently drops that promise.
#
# `persistence_location` is deliberately NOT set here. Debian's own
# /etc/mosquitto/mosquitto.conf already sets it to /var/lib/mosquitto/ -- the same
# value -- and mosquitto treats a second occurrence as a fatal error rather than
# an override:
#
#   Error: Duplicate persistence_location value in configuration.
#   Error found at /etc/mosquitto/conf.d/aqua.conf:34.
#
# which stops the broker starting at all. `persistence true` below is harmless
# (booleans are not rejected as duplicates), and is kept so this file still states
# the requirement rather than inheriting it silently.
persistence true
autosave_interval 60

# Retained presence messages are the point of LWT, so retained messages must
# survive restart too.
retain_available true

# -- limits ------------------------------------------------------------------
# Four nodes at 5 Hz batching every 5 s is a trivial load. These bounds exist to
# contain a malfunctioning node, not to manage normal traffic.
max_connections 32
max_queued_messages 200
max_inflight_messages 20
max_keepalive 120

# A node that vanishes should be marked offline promptly. The broker's LWT
# publishes `{"online":false}` on the connection's behalf, replacing the previous
# 60-second heartbeat heuristic entirely - the gateway learns immediately instead
# of inferring it from a stale timestamp a minute later.
#
# Nodes send keepalive=60, so the broker notices a dead link within ~90 s.
# The gateway additionally applies its own staleness check for nodes that are
# connected but silent, which is the failure mode LWT cannot see.
sys_interval 10

# -- logging -----------------------------------------------------------------
# stderr only, so journald's volatile config handles it and nothing reaches the SD
# card. Never log to a file here.#
# Note that `log_dest` ACCUMULATES: it does not override, so this line does not
# replace whatever the base configuration set. Debian ships
#
#   log_dest file /var/log/mosquitto/mosquitto.log
#
# and it stays active alongside this one, which is why install.sh comments that
# line out -- an additive option cannot be undone from conf.d, and the broker
# writing every connection and notice to the card is exactly the wear the
# journald-to-RAM change exists to avoid.log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true

# -- per-listener protocol ---------------------------------------------------
# MQTT 3.1.1 is what ESP-IDF and PubSubClient speak. No websockets, no MQTT 5.
# (If the dashboard ever needs to subscribe directly from the browser you would add
#  websockets here - but the gateway holds the subscription instead, so the browser
#  needs only SSE, which is far simpler and survives proxies.)
protocol mqtt

# -----------------------------------------------------------------------------
# Create node credentials:
#
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd odrive
#   sudo mosquitto_passwd    /etc/mosquitto/passwd od_sensor
#   sudo mosquitto_passwd    /etc/mosquitto/passwd mixer
#   sudo mosquitto_passwd    /etc/mosquitto/passwd pump
#   sudo mosquitto_passwd    /etc/mosquitto/passwd gateway
#
# Then set ownership so the broker can read it:
#
#   sudo chown mosquitto:mosquitto /etc/mosquitto/passwd
#   sudo chmod 0600 /etc/mosquitto/passwd
#
# Verify the throughput claim on this hardware before trusting it:
#
#   mosquitto_sub -h 127.0.0.1 -t 'aqua/#' -v
# -----------------------------------------------------------------------------
