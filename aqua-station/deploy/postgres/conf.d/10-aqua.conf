# =============================================================================
# PostgreSQL tuning for a Raspberry Pi 3B+ with 905 MB RAM
# =============================================================================
# Install to: /etc/postgresql/17/main/conf.d/10-aqua.conf
#
# Why this file exists: the stock configuration assumes a machine far larger than
# this one and lands at roughly 200 MB resident. The workload here is ~0.5 rows/s
# with a handful of tiny tables, so the defaults are spending memory on nothing.
# Tuned, PostgreSQL sits around 50-80 MB.
#
# The single biggest ask is shared_buffers. The second is jit=off: on ARM, JIT
# compilation costs memory AND CPU for queries that take microseconds anyway.
# =============================================================================

# -- memory ------------------------------------------------------------------
# The main resident allocation. 128 MB default is 4x what this workload can use.
shared_buffers = 48MB

# Per sort/hash node, and per connection. Kept low because connections are few
# and queries are tiny; a large value here multiplies by query complexity.
work_mem = 1MB
maintenance_work_mem = 24MB
wal_buffers = 2MB

# Planner hint only - allocates nothing. Set to roughly shared_buffers + an
# allowance for the OS page cache, which is large here because the archive
# directory dominates the filesystem.
effective_cache_size = 256MB

# -- connections -------------------------------------------------------------
# Only the gateway, the flush job and an occasional psql session connect.
max_connections = 12

# -- parallelism -------------------------------------------------------------
# Each worker is a separate process with its own memory. Parallel plans lose on
# queries this small, so disable them at the gather stage entirely.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# -- autovacuum --------------------------------------------------------------
# A handful of small tables. One worker is enough, and fewer workers means fewer
# processes resident and less random I/O on the SD card.
autovacuum_max_workers = 1
autovacuum_naptime = 5min
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# -- JIT ---------------------------------------------------------------------
# Off. This is the second-largest win after shared_buffers on an ARM SBC.
jit = off

# -- huge pages --------------------------------------------------------------
# The Pi has no huge pages. "try" wastes a startup probe and can log warnings.
huge_pages = off

# -- logging -----------------------------------------------------------------
# Never let PostgreSQL write log files to the SD card. stderr goes to journald,
# which deploy/journald/10-aqua-volatile.conf pins to RAM.
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 500ms
log_checkpoints = off
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000ms

# -- write behaviour ---------------------------------------------------------
# Durability trade, stated explicitly: this database holds operational state and
# rollups, which are re-derivable from the CSV archive. Losing the last ~200 ms
# on a power cut costs re-aggregation, not data. Given the board's history of
# under-voltage events, this is worth the reduction in fsync-driven SD writes.
#
# If a future requirement makes this database authoritative, change this to 'on'
# and accept the write cost.
synchronous_commit = off
wal_compression = on
wal_writer_delay = 200ms
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
# 1 GB WAL cap is generous for this workload; it bounds disk use without churning.
max_wal_size = 1GB
min_wal_size = 80MB

# -- planner / stats ---------------------------------------------------------
# Fewer bytes per backend. Statistics live in shared memory by default since
# PostgreSQL 15 reworked the cumulative statistics system, so the old
# `stats_temp_storage = local` is not just unnecessary here -- the parameter was
# removed in 15, and setting it on 17 stops the server starting at all:
#
#   unrecognized configuration parameter "stats_temp_storage"
#   FATAL:  configuration file "/etc/postgresql/17/main/conf.d/10-aqua.conf" contains errors
#
# The cluster then stays down while the wrapper unit reports "active", so the first
# psql fails on a missing socket and names neither the cluster nor this file.
track_activity_query_size = 256
track_counts = on

# No TimescaleDB. With 5 Hz confined to 3-hour experiment windows and idle at
# 1/minute, total volume is roughly 880 MB/year of CSV. Compression and chunked
# retention solve a capacity problem that no longer exists. It can be added later
# in place via create_hypertable(), so this is not a one-way door.
shared_preload_libraries = ''
