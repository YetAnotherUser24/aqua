# =============================================================================
# Pin system logs to RAM
# =============================================================================
# Install to: /etc/systemd/journald.conf.d/10-aqua-volatile.conf
#
# Measured, before this change, with NO application running:
#
#     /sys/block/mmcblk0/stat:  7 write ops / 120 sectors / 61,440 bytes in 16 s
#     => ~0.44 write ops/second => ~38,000 write ops/day, ~330 MB/day
#
# For comparison, the entire telemetry archive needs about 58 write ops/day.
# Idle logging costs roughly 650x more SD writes than the data pipeline it is
# supposedly supporting.
#
# Root cause: TWO logging stacks were writing simultaneously - journald with
# Storage=persistent, plus rsyslog writing /var/log/syslog, kern.log and auth.log.
# Also disable rsyslog (see instructions below).
#
# Fixing this is free, and it is the single highest-leverage change for card life.
# =============================================================================

[Journal]
# Keep the journal in /run (RAM). Nothing is lost that matters: the gateway writes
# its own structured log stream, and the authoritative operational history is in
# the events table, not in journald.
Storage=volatile

# Hard caps so a chatty failure cannot fill RAM.
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M

# Reduce write frequency even for the in-RAM journal.
SyncIntervalSec=5m
RateLimitIntervalSec=30s
RateLimitBurst=2000

# -----------------------------------------------------------------------------
# Also disable rsyslog - it is the larger of the two writers:
#
#     sudo systemctl disable --now rsyslog
#
# And stop phoning home about it:
#
#     sudo systemctl mask systemd-journald-audit.socket   # optional
#
# Verify the fix:
#
#     a=$(awk '{print $7}' /sys/block/mmcblk0/stat); sleep 60
#     b=$(awk '{print $7}' /sys/block/mmcblk0/stat)
#     echo "$(( (b - a) * 512 )) bytes written in 60s"
#
# Target: under 10 MB/day idle, versus ~330 MB/day before.
# -----------------------------------------------------------------------------
