; PlatformIO - Nodo AERADOR (ODrive S1 por UART ASCII + bus DC en el INA226)
;
; Placa real: ESP32-S3 (SuperMini / DevKitC-1, 4 MB).
; El ODrive S1 es el unico actuador de aireacion; se comanda a 0-600 RPM (ver AGENTS.md regla 2).
;
;   pio run                       -> construye el entorno por defecto (esp32-s3)
;   pio run -t upload             -> flashea por USB
;   pio run -e esp32-s3-ota -t upload   -> flashea por WiFi (aquacontrol-odrive.local)
;   pio run -e virtual -t upload        -> firmware sin hardware (motor simulado)
;
; `min_spiffs.csv` mantiene dos ranuras de aplicacion: sin ellas el OTA no tiene destino.

[platformio]
default_envs = esp32-s3

; ---------------------------------------------------------------
; Comun a TODOS los entornos
; ---------------------------------------------------------------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
; Los programas de banco no forman parte del firmware del nodo.
; El bus del motor se elige por entorno: real (ODriveUART) o virtual (motor_sim).
build_src_filter = +<*> -<test_odrive_uart.cpp> -<verify_odrive.cpp> -<motor_bus_virtual.cpp>


; ---------------------------------------------------------------
; PLACA REAL: ESP32-S3 (SuperMini / DevKitC-1), 4 MB de flash
; ---------------------------------------------------------------
[env:esp32-s3]
board = esp32-s3-devkitc-1
upload_speed = 460800
upload_flags =
    --no-stub
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = aquacontrol-odrive.local
upload_flags =
    --port=3232
    --timeout=60

[env:esp32-s3-virtual]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DAERADOR_VIRTUAL=1
build_src_filter =
    +<*>
    -<test_odrive_uart.cpp>
    -<verify_odrive.cpp>
    -<motor_bus_real.cpp>
    -<odrive_uart.cpp>


; ---------------------------------------------------------------
; ALTERNATIVA: ESP32 clasico (WROOM-32) y LilyGO T3 LoRa32
; ---------------------------------------------------------------
[env:esp32dev]
board = esp32dev
upload_speed = 921600

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = aquacontrol-odrive.local
upload_flags =
    --port=3232
    --timeout=60

[env:esp32dev-virtual]
extends = env:esp32dev
build_flags =
    -DODRIVE_VIRTUAL=1

[env:lora32]
board = esp32dev
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32

[env:lora32-virtual]
extends = env:lora32
build_flags =
    ${env:lora32.build_flags}
    -DODRIVE_VIRTUAL=1

[env:lora32-ota]
extends = env:lora32
upload_protocol = espota
upload_port = aquacontrol-odrive.local
upload_flags =
    --port=3232
    --timeout=60

; ---------------------------------------------------------------
; BANCO: verificacion de la telemetria del ODrive por USB (sin WiFi ni nube)
; Lee las 6 variables y las imprime como CSV para compararlas con tools/odrive_monitor.py
; ---------------------------------------------------------------
[env:verify]
extends = env:esp32-s3
build_src_filter =
    +<odrive_uart.cpp>
    +<verify_odrive.cpp>

; ---------------------------------------------------------------
; BANCO: prueba del protocolo UART ASCII del ODrive
; ---------------------------------------------------------------
[env:uart-test]
extends = env:esp32dev
build_src_filter =
    +<odrive_uart.cpp>
    +<test_odrive_uart.cpp>