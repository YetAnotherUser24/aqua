; PlatformIO - Nodo SENSOR OD (Aqualabo DIGISENS / OPTOD por RS-485 Modbus)
;
; Placa real del banco de la tesis: LilyGO T3 LoRa32 (ESP32-PICO-D4) + HAT SP3485EN.
; Ver AGENTS.md regla 21: el pinout depende de la placa y confundirlos cuelga el ESP32-PICO-D4.
; Es la UNICA placa soportada; la bateria se lee por el divisor ADC (SENSOR_BATTERY_ADC).
;
;   pio run                          -> construye el entorno por defecto (lora32)
;   pio run -t upload                -> flashea por USB
;   pio run -e lora32-ota -t upload  -> flashea por WiFi (od-logger-lora.local)
;   pio run -e virtual -t upload     -> firmware sin sensor fisico (bus simulado)
;
; Todos los entornos usan particiones OTA (invariante 13 del proyecto).

[platformio]
default_envs = lora32

; ---------------------------------------------------------------
; Comun a TODOS los entornos
; ---------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_ota.csv
lib_extra_dirs = lib
; El bus de sensores se elige por entorno: real (Modbus/ADC) o virtual (sensor_sim).
build_src_filter = +<*> -<sensor_bus_virtual.cpp> -<sensor_sim.cpp>

; ---------------------------------------------------------------
; PLACA REAL: LilyGO T3 LoRa32 (v1.6) + HAT de instrumentacion
; ---------------------------------------------------------------
[env:lora32]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
; Schema-v2 telemetry + command transport (used by aqua_link.cpp).
;
; Declared here rather than in the shared [env] block because `lib_deps` is a scalar: an
; environment that sets its own `lib_deps` REPLACES the inherited value instead of extending
; it. lora32 sets one, so anything it needs has to live here. Everything that extends
; env:lora32 -- lora32-ota, virtual and virtual-s3 -- inherits this list, which is what makes
; a virtual sensor node speak the same protocol as hardware (VIRTUAL_NODES.md).
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit GFX Library @ ^1.12.1
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger-lora\"
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC
    -DWIFI_MODULE
    -DWEB_MASTER_MODE
    -DSD_MODULE

[env:lora32-ota]
extends = env:lora32
upload_protocol = espota
upload_port = od-logger-lora.local
upload_flags =
    --port=3232
    --timeout=60

; ---------------------------------------------------------------
; VIRTUAL: sensor sintetico, sin hardware (pruebas de UI y de flujo).
; Usa el mismo backend real con la misma DEVICE_KEY. La bateria es ADC.
; ---------------------------------------------------------------
[env:virtual]
extends = env:lora32
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger-lora\"
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW
    -DWEB_MASTER_MODE
    -DSD_MODULE
build_src_filter =
    +<*>
    -<sensor_bus_real.cpp>
    -<modbus_rtu.cpp>

; Alias del mismo bus virtual apuntando a un ESP32-S3 (banco de pruebas).
; La placa objetivo del nodo sigue siendo la LoRa32; esto solo facilita flashear
; el firmware virtual en una placa S3 de banco.
[env:virtual-s3]
extends = env:virtual
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DN_LOGGER_DEVICE_NAME=\"od-logger-lora\"
    -DSENSOR_OD
    -DSENSOR_BATTERY_ADC
    -DWIFI_MODULE
    -DSENSOR_VIRTUAL
    -DDISABLE_ESPNOW
    -DWEB_MASTER_MODE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Overrides solo para el banco S3 (los pines de la LoRa32 no existen en un
    ; devkit S3). No afectan al nodo real. Sin SD_MODULE: el devkit no tiene
    ; tarjeta microSD y el montaje fallido reiniciaba el nodo.
    -DI2C_SDA_PIN=8
    -DI2C_SCL_PIN=9
    -DWAKEUP_PIN=GPIO_NUM_10
    -DOD_RX_PIN=11
    -DOD_TX_PIN=12
    -DOD_DE_RE_PIN=13
    -DOD_PWR_PIN=14

; ---------------------------------------------------------------
; DIAGNOSTICO: sonda del bus RS-485 (pin DE/RE, polaridad, baud y esclavo)
; Uso: pio run -e probe -t upload && pio device monitor
; ---------------------------------------------------------------
[env:probe]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32
    -DMODBUS_PROBE_TOOL
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    -<*>
    +<modbus_probe.cpp>
    +<modbus_rtu.cpp>

; ---------------------------------------------------------------
; DIAGNOSTICO: escaner del bus I2C (descubre perifericos y anota los conocidos)
; ---------------------------------------------------------------
[env:i2c-scan]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_LILYGO_LORA32
    -DDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DI2C_SCANNER
lib_deps =
build_src_filter =
    -<*>
    +<i2c_scanner.cpp>
